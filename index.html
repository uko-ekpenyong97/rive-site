<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rive — Redesign Study by Uko Ekpenyong</title>
    <!-- The display face, above the fold in the hero H1. Preloaded because it
         is discovered late otherwise: the browser has to fetch and parse the CSS
         bundle before it learns this file exists. The other seven faces are not
         preloaded — they would compete with this one for the same connection. -->
    <link
      rel="preload"
      href="/fonts/tomorrow-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
